# Pipeline de publicação automática do CONTRATE A ARTE.
#
# Gratuito para sempre enquanto o repositório for PÚBLICO (GitHub Actions não cobra
# minutos em repositórios públicos). Se o repo virar privado, isso passa a consumir
# a cota de 2000 min/mês do plano Free.
#
# Este workflow só faz a parte "planilha -> JSON + fotos" e commita o resultado.
# Só ele fala com a Sheets/Drive API — o Cloudflare Pages (que faz o deploy do site
# em si, automático a cada push) só roda `npm run build:site` a partir do que já
# está commitado aqui, sem nunca precisar das credenciais da planilha. Ver
# docs/CLOUDFLARE-PAGES.md.
#
# Requer os secrets (Settings -> Secrets and variables -> Actions):
#   - SHEETS_SERVICE_ACCOUNT_JSON: conteúdo do .json da service account
#   - SHEETS_ID: id da planilha de respostas

name: Atualizar dados publicados

on:
  schedule:
    - cron: "0 12 * * *"   # 1x por dia, 12:00 UTC (~09:00 em Brasília) - ajustar se quiser mais frequência
  workflow_dispatch: {}      # permite rodar manualmente pelo botão "Run workflow" no GitHub

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline (planilha -> JSON + fotos)
        env:
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_data.py

      - name: Commitar dados/fotos atualizados
        run: |
          git config user.name "contrate-a-arte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/_data src/img/artistas
          git diff --cached --quiet || git commit -m "chore: atualiza perfis publicados [automático]"
          git push
